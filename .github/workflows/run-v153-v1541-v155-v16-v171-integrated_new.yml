name: Run Integrated Pipeline (Manual)

on:
  workflow_dispatch:
    inputs:
      skip_input_check:
        description: 'Bỏ qua kiểm tra file đầu vào từ Trading Bot? (không khuyến khích)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  run-integrated-pipeline:
    name: Run V15.3 → V17.1 Integrated (manual)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_intraday.txt ]; then pip install -r requirements_intraday.txt; fi
          pip install pandas numpy

      # ===== BACKUP WATCHLIST GỐC TRƯỚC KHI CHẠY =====
      - name: Backup original watchlist
        run: |
          if [ -f intraday_watchlist_v17.csv ]; then
            cp intraday_watchlist_v17.csv intraday_watchlist_v17_backup.csv
            echo "Đã backup watchlist gốc"
          fi
          if [ -f v17_final_decision.csv ]; then
            cp v17_final_decision.csv v17_final_decision_backup.csv
            echo "Đã backup v17_final_decision gốc"
          fi

      # ===== KIỂM TRA ĐẦU VÀO (tùy chọn) =====
      - name: Check mandatory input files from Trading Bot
        if: github.event.inputs.skip_input_check != 'true'
        run: |
          echo "===== KIỂM TRA FILE ĐẦU VÀO ====="
          MISSING=0
          for f in v152_momentum_walkforward.csv v152_bottom_walkforward.csv v17_final_decision_backup.csv intraday_watchlist_v17_backup.csv; do
            if [ -f "$f" ]; then
              echo "✅ $f tồn tại"
            else
              echo "❌ $f không tìm thấy - cần chạy 'Run Trading Bot' trước"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "ERROR: Thiếu file đầu vào bắt buộc. Pipeline dừng."
            exit 1
          fi

      # ===== ĐẶT BIẾN MÔI TRƯỜNG (trỏ đến file backup để tránh ảnh hưởng) =====
      - name: Set environment variables for V15.3
        run: |
          echo "V152_MOM_WF_CSV=v152_momentum_walkforward.csv" >> $GITHUB_ENV
          echo "V152_BOTTOM_WF_CSV=v152_bottom_walkforward.csv" >> $GITHUB_ENV
          echo "V17_FINAL_DECISION_CSV=v17_final_decision_backup.csv" >> $GITHUB_ENV
          echo "INTRADAY_WATCHLIST_CSV=intraday_watchlist_v17_backup.csv" >> $GITHUB_ENV

      # ===== KIỂM TRA CÁC SCRIPT =====
      - name: Check required python files
        run: |
          test -f v153_pro_research_upgrade_vi.py || exit 1
          test -f v1541_portfolio_risk_exit_engine_vi.py || exit 1
          test -f v155_equity_survival_engine_vi.py || exit 1
          test -f v16_meta_allocation_intelligence_vi.py || exit 1
          test -f v171_final_decision_orchestrator_vi.py || exit 1

      - name: Syntax check
        run: |
          python -m py_compile v153_pro_research_upgrade_vi.py
          python -m py_compile v1541_portfolio_risk_exit_engine_vi.py
          python -m py_compile v155_equity_survival_engine_vi.py
          python -m py_compile v16_meta_allocation_intelligence_vi.py
          python -m py_compile v171_final_decision_orchestrator_vi.py

      # ===== CHẠY CÁC LAYER =====
      - name: Run V15.3 PRO research layer
        run: |
          echo "===== RUN V15.3 PRO ====="
          python3 v153_pro_research_upgrade_vi.py

      - name: Run V15.4.1 portfolio risk exit layer
        run: |
          echo "===== RUN V15.4.1 ====="
          python3 v1541_portfolio_risk_exit_engine_vi.py

      - name: Run V15.5 equity survival layer
        run: |
          echo "===== RUN V15.5 ====="
          python3 v155_equity_survival_engine_vi.py

      - name: Run V16 meta allocation intelligence layer
        run: |
          echo "===== RUN V16 ====="
          python3 v16_meta_allocation_intelligence_vi.py

      - name: Run V17.1 final decision orchestrator layer
        run: |
          echo "===== RUN V17.1 ====="
          python3 v171_final_decision_orchestrator_vi.py

      # ===== SAU KHI CHẠY XONG: LƯU KẾT QUẢ MỚI (ĐÃ QUA LỌC) =====
      - name: Save integrated outputs (with _integrated suffix)
        run: |
          if [ -f v17_final_decision.csv ]; then
            cp v17_final_decision.csv v17_final_decision_integrated.csv
          fi
          if [ -f intraday_watchlist_v17.csv ]; then
            cp intraday_watchlist_v17.csv intraday_watchlist_v17_integrated.csv
          fi
          echo "Đã lưu kết quả integrated (có thể khác với gốc)"

      # ===== KHÔI PHỤC FILE GỐC TỪ BACKUP =====
      - name: Restore original watchlist and final decision
        run: |
          if [ -f intraday_watchlist_v17_backup.csv ]; then
            mv intraday_watchlist_v17_backup.csv intraday_watchlist_v17.csv
            echo "Đã khôi phục watchlist gốc"
          fi
          if [ -f v17_final_decision_backup.csv ]; then
            mv v17_final_decision_backup.csv v17_final_decision.csv
            echo "Đã khôi phục v17_final_decision gốc"
          fi

      # ===== KIỂM TRA KẾT QUẢ =====
      - name: Check final outputs
        run: |
          test -f v17_final_decision_integrated.csv || exit 1
          test -f intraday_watchlist_v17_integrated.csv || exit 1
          test -f v171_orchestrator_report.txt || exit 1
          test -f v171_orchestrator.html || exit 1

      # ===== COMMIT CẢ FILE GỐC (đã khôi phục) VÀ FILE INTEGRATED =====
      - name: Commit integrated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v17_final_decision.csv
          git add intraday_watchlist_v17.csv
          git add v17_final_decision_integrated.csv
          git add intraday_watchlist_v17_integrated.csv
          git add v171_orchestrator_report.txt
          git add v171_orchestrator.html
          git add v153_*.csv v153_*.html v1541_*.csv v155_*.csv v16_*.csv || true
          git commit -m "Manual integrated run $(date +'%Y-%m-%d %H:%M:%S') - original files restored, integrated results saved" || echo "No changes"
          git push

      - name: Print final V17.1 report
        if: always()
        run: |
          echo "===== FINAL REPORT V17.1 (INTEGRATED) ====="
          if [ -f v171_orchestrator_report.txt ]; then
            cat v171_orchestrator_report.txt
          else
            echo "Không có report V17.1."
          fi

      - name: Upload integrated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-manual-output
          if-no-files-found: warn
          retention-days: 14
          path: |
            v153_pro_research*.csv
            v153_pro_research*.html
            v1541_portfolio_risk_exit*.csv
            v155_equity_survival*.csv
            v16_meta_allocation*.csv
            v16_meta_risk_state.csv
            v16_capital_map.csv
            v16_rotation_plan.csv
            v17_final_decision.csv
            intraday_watchlist_v17.csv
            v17_final_decision_integrated.csv
            intraday_watchlist_v17_integrated.csv
            v171_orchestrator_report.txt
            v171_orchestrator.html
