name: Run V19.2 Position Telegram Desk

on:
  workflow_dispatch:

jobs:
  run-v192:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pandas numpy requests

      # ===== DEBUG MỞ RỘNG: IN TẤT CẢ FILE V19 / POSITION =====
      - name: Debug all V19 and position files
        run: |
          echo "=== DANH SÁCH FILE TRONG THƯ MỤC GỐC ==="
          ls -la
          echo ""
          echo "=== NỘI DUNG CÁC FILE V19* ==="
          for f in v19*.csv v19*.json; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
              echo ""
            fi
          done
          echo "=== NỘI DUNG CÁC FILE *POSITION* ==="
          for f in *position*.csv *position*.json; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
              echo ""
            fi
          done
          echo "=== NỘI DUNG CÁC FILE *STATE* ==="
          for f in *state*.csv *state*.json; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
              echo ""
            fi
          done
          echo "=== KIỂM TRA THƯ MỤC v19.danh_muc_mua ==="
          ls -la v19.danh_muc_mua/ || echo "Thư mục không tồn tại"
          for f in v19.danh_muc_mua/*.csv v19.danh_muc_mua/*.json; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
              echo ""
            fi
          done

      - name: Run V19.2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE/v19.3_alert_lichsu_canhbao:$GITHUB_WORKSPACE/v19.danh_muc_mua"
          python v19.danh_muc_mua/v192_realtime_position_telegram_desk_vi.py

      - name: Commit outputs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add *.csv *.txt *.json || true

          git commit -m "Update V19.2 outputs" || echo "No changes"

          git push
