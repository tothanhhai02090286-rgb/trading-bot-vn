name: Run V19.2 Position Telegram Desk

on:
  workflow_dispatch:

jobs:
  run-v192:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pandas numpy requests

      # ===== THÊM BƯỚC DEBUG: IN NỘI DUNG FILE POSITIONS =====
      - name: Debug positions file
        run: |
          echo "=== NỘI DUNG positions_v19.csv (thư mục gốc) ==="
          cat positions_v19.csv || echo "Không tìm thấy file ở thư mục gốc"
          echo ""
          echo "=== NỘI DUNG positions_v19.csv (trong v19.danh_muc_mua) ==="
          cat v19.danh_muc_mua/positions_v19.csv 2>/dev/null || echo "Không có file trong v19.danh_muc_mua"
          echo ""
          echo "=== DANH SÁCH FILE TRONG THƯ MỤC v19.danh_muc_mua ==="
          ls -la v19.danh_muc_mua/ 2>/dev/null || echo "Thư mục không tồn tại"

      - name: Run V19.2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE/v19.3_alert_lichsu_canhbao:$GITHUB_WORKSPACE/v19.danh_muc_mua"
          python v19.danh_muc_mua/v192_realtime_position_telegram_desk_vi.py

      - name: Commit outputs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add *.csv *.txt *.json || true

          git commit -m "Update V19.2 outputs" || echo "No changes"

          git push
